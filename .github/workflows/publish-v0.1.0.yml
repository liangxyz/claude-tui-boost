name: Release complete standalone Claude TUI plugin

# Deliberately manual. This workflow never pushes a branch, modifies main,
# deploys a runtime, or uses a production Claude account.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact published package version (example: v0.2.7-rc.1)'
        required: true
        type: string
      candidate_run_id:
        description: 'Successful Plugin source and distributable package run on the release branch'
        required: true
        type: string

permissions:
  contents: write
  actions: read
  checks: read

concurrency:
  group: standalone-plugin-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify tagged source and publish complete installable archive
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: Fail closed on wrong ref, release tag, or existing release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || {
            echo 'Release requires merged main; PR branches cannot be released.' >&2; exit 2;
          }
          node -e 'const p=require("./package.json"); if(process.argv[1] !== "v"+p.version) process.exit(2)' "$RELEASE_TAG" || {
            echo 'Release tag must exactly match package.json; change/merge the version first.' >&2; exit 2;
          }
          git fetch --no-tags --depth=1 origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD || ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'Checked out source is not the exact latest main commit.' >&2; exit 2;
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo 'Release tag already exists; refusing mutation.' >&2; exit 2;
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing mutation.' >&2; exit 2;
          fi
      - name: Verify successful candidate checks for the source being released
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate="release/$RELEASE_TAG"
          api="repos/$GITHUB_REPOSITORY"
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags --depth=1 origin "refs/heads/$candidate"
          candidate_tree=refs/remotes/origin/verified-release-candidate
          git update-ref "$candidate_tree" FETCH_HEAD
          gh api "$api/actions/runs/$CANDIDATE_RUN_ID" | jq -e --arg repo "$GITHUB_REPOSITORY" --arg branch "$candidate" '
            .head_repository.full_name == $repo and .head_branch == $branch and .event == "workflow_dispatch" and
            .path == ".github/workflows/plugin-pr-ci.yml" and .status == "completed" and .conclusion == "success"' >/dev/null
          check_url=$(gh api "$api/actions/runs/$CANDIDATE_RUN_ID/jobs?filter=latest" | jq -er '
            [.jobs[] | select(.name == "test-and-pack" and .conclusion == "success")] |
            select(length == 1) | .[0].check_run_url | select(type == "string" and length > 0)')
          ref=$(jq -nr --arg ref "heads/$candidate" '$ref | @uri')
          gh api --paginate "$api/commits/$ref/check-runs?check_name=test-and-pack&filter=all&per_page=100" |
            jq -se --arg check "$check_url" '
              any(.[].check_runs[]; .url == $check and .app.slug == "github-actions" and .conclusion == "success")' >/dev/null
          # Release branches are maintained by repository writers and promoted by fast-forward.
          git fetch --no-tags --depth=1 origin "refs/heads/$candidate"
          if ! git merge-base --is-ancestor "$candidate_tree" FETCH_HEAD || ! git merge-base --is-ancestor FETCH_HEAD "$candidate_tree"; then
            echo 'Candidate moved during verification.' >&2; exit 2
          fi
          if ! git diff --quiet --no-renames "$candidate_tree" HEAD -- . ':(top,exclude).github/workflows/publish-v0.1.0.yml'; then
            echo 'Main and the tested candidate differ outside the publish workflow.' >&2; exit 2
          fi
          printf 'Candidate CI: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CANDIDATE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify all eight binaries reproduce byte for byte
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          for os in darwin linux; do
            for arch in arm64 amd64; do
              for kind in magpie-tui-runtime magpie-tui-mcp-helper; do
                (cd runtime && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                  go build -trimpath -buildvcs=false -o "$dir/$kind.$os-$arch" "./cmd/$kind")
                cmp "$dir/$kind.$os-$arch" "bin/$kind.$os-$arch" || {
                  echo "Binary differs from source: $kind.$os-$arch" >&2; exit 3;
                }
              done
            done
          done
          node scripts/verify-package-assets.mjs
      - name: Build and unpack exactly the plugin being released
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/plugin-release"
          npm pack --silent --pack-destination "$RUNNER_TEMP/plugin-release"
          name="$(node -p 'const p=require("./package.json"); `${p.name}-${p.version}.tgz`')"
          test -s "$RUNNER_TEMP/plugin-release/$name"
          tar -xzf "$RUNNER_TEMP/plugin-release/$name" -C "$RUNNER_TEMP/plugin-release"
          node "$RUNNER_TEMP/plugin-release/package/scripts/verify-package-assets.mjs"
          test -s "$RUNNER_TEMP/plugin-release/package/package-assets.json"
          test -s "$RUNNER_TEMP/plugin-release/package/scripts/magpie-tui-doctor.mjs"
          test -s "$RUNNER_TEMP/plugin-release/package/RELEASE_NOTES.md"
          git diff --quiet && git diff --cached --quiet || {
            echo 'Release verification unexpectedly modified tracked source.' >&2; exit 2;
          }
      - name: Create release with full plugin tarball and platform asset inventory
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          name="$(node -p 'const p=require("./package.json"); `${p.name}-${p.version}.tgz`')"
          dir="$RUNNER_TEMP/plugin-release"
          options=(--target "$GITHUB_SHA" --title "$RELEASE_TAG — standalone Claude TUI plugin" --notes-file RELEASE_NOTES.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            "$dir/$name" "$dir/package/package-assets.json" \
            bin/magpie-tui-runtime.* bin/magpie-tui-mcp-helper.* \
            "${options[@]}"
